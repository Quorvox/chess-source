<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Панель</title>
  <link rel="icon" href="/logo.svg">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .adm { display: grid; grid-template-columns: 190px 1fr; gap: 22px; align-items: start; }
    .adm-nav { position: sticky; top: 14px; display: flex; flex-direction: column; gap: 4px; }
    .adm-nav .g { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); margin: 14px 0 4px 12px; }
    .adm-nav .g:first-child { margin-top: 0; }
    .adm-nav button { text-align: left; background: transparent; color: var(--mute); box-shadow: none; padding: 9px 12px; border-radius: 10px; }
    .adm-nav button:hover { background: #ffffff0d; color: var(--ink); }
    .adm-nav button.on { background: var(--panel2); color: var(--ink); box-shadow: inset 3px 0 0 var(--gold); }
    .bars { display: flex; align-items: flex-end; gap: 5px; height: 110px; }
    .bar { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
    .bar i { width: 100%; border-radius: 4px 4px 0 0; display: block; }
    .bar span { font-size: 10px; color: var(--mute); }
    table.rows tbody tr[data-open], table.rows tbody tr[data-game] { cursor: pointer; }
    table.rows tbody tr:hover { background: #ffffff0a; }
    .bulk { align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 12px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--gold); }
    .bulk[hidden] { display: none !important; }
    .res { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
    .res.rw { background: #7fb85a33; color: var(--green); } .res.rl { background: #e5534b33; color: var(--red); } .res.rd { background: #ffffff1a; color: var(--mute); }
    .modal.top { z-index: 300; }
    .tabs.sub { margin-bottom: 14px; }
    .tabs.sub button { padding: 7px 13px; font-size: 14px; }
    .grow { flex: 1; }
    @media (max-width: 820px) {
      .adm { grid-template-columns: 1fr; }
      .adm-nav { position: static; flex-direction: row; flex-wrap: wrap; }
      .adm-nav .g { display: none; }
      .adm-nav button.on { box-shadow: inset 0 -3px 0 var(--gold); }
    }
  </style>
</head>
<body>
  <main id="view" style="max-width:1280px;margin:0 auto;padding:20px"></main>
  <script type="module" src="/main.js"></script>
</body>
</html>
